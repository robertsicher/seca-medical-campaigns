name: Test and deploy Beyond Weight
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependencies only
        run: npm install --no-save playwright @axe-core/playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test project-path site, tools and accessibility
        run: node tests/site.test.cjs
      - name: Upload QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beyond-weight-quality
          path: test-results/
          retention-days: 14
      - name: Package the static site (no compilation)
        run: |
          mkdir -p public-site
          cp index.html .nojekyll public-site/
          cp -R weight-management pathway-efficiency patient-engagement private-health clinical-applications nhs-pilot resources campaign-strategy assets public-site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the verified static site
        id: deployment
        uses: actions/deploy-pages@v4
